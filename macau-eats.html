<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마카오 맛집 쇼츠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a120c; --cream:#FFF4DE; --yellow:#FFD23F; --blue:#1F4FD6; --pink:#FF4F7B;
  --mint:#29CFA2; --orange:#FF8A1F; --red:#D7362B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0b}
body{overflow:hidden;font-family:'Noto Sans KR',system-ui,sans-serif}
#wrap{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.scene{position:absolute;inset:0;overflow:hidden;display:none;will-change:transform,filter}
.abs{position:absolute}
.bh{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em}
.jua{font-family:'Jua','Noto Sans KR',sans-serif}
.emoji{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.outline{ --o:6px; --c:var(--ink);
  text-shadow: var(--o) 0 0 var(--c), calc(var(--o)*-1) 0 0 var(--c), 0 var(--o) 0 var(--c), 0 calc(var(--o)*-1) 0 var(--c),
  calc(var(--o)*.7) calc(var(--o)*.7) 0 var(--c), calc(var(--o)*-.7) calc(var(--o)*.7) 0 var(--c),
  calc(var(--o)*.7) calc(var(--o)*-.7) 0 var(--c), calc(var(--o)*-.7) calc(var(--o)*-.7) 0 var(--c),
  0 calc(var(--o)*2.4) 0 var(--c);}
.rays{position:absolute;left:50%;top:51%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:#fff;border:5px solid var(--ink);
  box-shadow:0 9px 0 var(--ink);font-weight:900;font-size:44px;white-space:nowrap}
.tag{padding:18px 34px;border-radius:26px;border:6px solid var(--ink);box-shadow:0 10px 0 var(--ink);font-size:66px;white-space:nowrap}
.prog{display:flex;gap:12px}
.prog i{display:block;width:62px;height:18px;border-radius:9px;border:4px solid var(--ink);background:rgba(255,255,255,.55)}
.prog i.on{background:var(--ink)}
#cap{position:absolute;left:60px;right:60px;top:1490px;text-align:center;z-index:50;pointer-events:none}
#cap span{display:inline-block;font-weight:900;font-size:78px;line-height:1.15;color:#fff;--o:7px;--c:#111;padding:0 6px}
#cap span.hl{color:var(--yellow)}
#grain{position:absolute;inset:-64px;z-index:90;opacity:.10;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;z-index:89;pointer-events:none;background:radial-gradient(ellipse 80% 65% at 50% 48%,transparent 55%,rgba(0,0,0,.28) 100%)}
#flash{position:absolute;inset:0;z-index:95;background:#fff;opacity:0;pointer-events:none}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;background:rgba(0,0,0,.55);
  color:#fff;font:900 22px 'Noto Sans KR',sans-serif;border:0;cursor:pointer;flex-direction:column;gap:14px;width:100%}
#play b{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:var(--pink);font-size:40px}
.render #play{display:none}
.check{display:flex;align-items:center;gap:26px;font-size:54px;font-weight:900;padding:18px 0;border-bottom:4px dashed rgba(26,18,12,.25)}
.check:last-child{border-bottom:0}
.box{flex:none;width:70px;height:70px;border-radius:18px;border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff}
.box svg{width:52px;height:52px}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam"></div>
  <div id="cap"></div>
  <div id="vig"></div><div id="grain"></div><div id="flash"></div>
</div></div>

const capEl = document.getElementById('cap');
const CHUNKS = [];
VO.forEach((v,vi)=>{
  const words = v.text.split(' ');
  const groups=[]; let cur=[];
  const syl = w => (w.match(/[가-힣]/g)||[]).length;
  words.forEach(w=>{cur.push(w); const n=cur.reduce((a,x)=>a+syl(x),0);
    if(/[.,!?]$/.test(w) && n>=4 || n>=8){groups.push(cur);cur=[]}});
  if(cur.length){ if(groups.length && cur.reduce((a,x)=>a+syl(x),0)<4) groups[groups.length-1].push(...cur); else groups.push(cur); }
  const wt = g => g.reduce((a,x)=>a+syl(x)+(/[.,!?]$/.test(x)?1.6:0.3),0);
  const tot = groups.reduce((a,g)=>a+wt(g),0); let acc=v.s;
  groups.forEach(g=>{const d=v.d*wt(g)/tot; CHUNKS.push({vi,a:acc,b:acc+d,words:g,hl:v.hl}); acc+=d});
});
let lastChunk=-1;
function renderCaption(t){
  let ci=-1;
  for(let i=0;i<CHUNKS.length;i++){const c=CHUNKS[i];const nx=CHUNKS[i+1];
    const end = (nx && nx.vi===c.vi)? nx.a : c.b+0.3;
    if(t>=c.a-0.05 && t<end){ci=i;break}}
  if(ci<0 || CHUNKS[ci].vi===0){capEl.style.opacity=0;return}
  capEl.style.opacity=1;
  if(ci!==lastChunk){
    const c=CHUNKS[ci];
    capEl.innerHTML=c.words.map(w=>`<span class="outline${c.hl.includes(w)?' hl':''}">${w.replace(/[.,]$/,'')}</span>`).join(' ');
    lastChunk=ci;
  }
  const p=back(prog(t,CHUNKS[ci].a-0.05,0.18));
  capEl.style.transform=`scale(${0.6+0.4*p})`;
  // keep caption clear of the outro card
  capEl.style.top = CHUNKS[ci].vi===6 ? '1560px' : '1490px';
}

  let s=1234567;const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}

const grain=document.getElementById('grain'), flash=document.getElementById('flash');

/* ===================== master render ===================== */
const TR_IN=0.14, TR_OUT=0.22;
function render(t){
  t=clamp(t,0,29.999);
  for(let i=0;i<scenes.length;i++){
    const a=SC[i], b=SC[i+1], s=scenes[i];
    const vis = t>=a-TR_IN && t<b+TR_OUT;
    s.el.style.display = vis?'block':'none';
    if(!vis) continue;
    let tx=0, sc=1, blur=0;
    if(i>0 && t<a+TR_OUT){ // incoming whip
      const p=eOut(prog(t,a-TR_IN,TR_IN+TR_OUT));
      const dir = i%2? 1 : -1;
      tx=(1-p)*1150*dir; blur=(1-p)*26; sc=1+(1-p)*0.12;
    }
    if(t>=b-TR_IN && i<scenes.length-1){ // outgoing push
      const p=eIn(prog(t,b-TR_IN,TR_IN+TR_OUT));
      const dir = (i+1)%2? -1 : 1;
      tx=p*480*dir; blur=Math.max(blur,p*20); sc=1-p*0.06;
    }
    s.el.style.transform=`translateX(${tx}px) scale(${sc})`;
    s.el.style.filter= blur>0.5?`blur(${blur.toFixed(1)}px)`:'none';
    s.render(t-a);
  }
  // beat punch-in (120 BPM) while the full groove is playing
  const bp=(t%0.5)/0.5;
  const punch = (t>4 && t<28)? 0.014*Math.exp(-bp*7) : 0;
  cam.style.transform=`scale(${1+punch})`;
  // flash on cuts
  let fl=0; for(let i=1;i<SC.length-1;i++){const d=t-SC[i]; if(d>-0.03&&d<0.18) fl=Math.max(fl,0.55*(1-clamp(d/0.18)))}
  flash.style.opacity=fl;
  const f=Math.floor(t*30); grain.style.transform=`translate(${(f*37)%64-32}px,${(f*53)%64-32}px)`;
  renderCaption(t);
}
window.render=render;

  let t0=null, raf=0;
  const loop=()=>{const t = au.src && !au.error && au.duration ? au.currentTime : (performance.now()-t0)/1000;
    render(t); if(t<30 && !(au.ended)) raf=requestAnimationFrame(loop); else {btn.style.display='flex';btn.lastChild.textContent='다시 보기'}};
  btn.addEventListener('click',()=>{btn.style.display='none';t0=performance.now();au.currentTime=0;au.play().catch(()=>{});cancelAnimationFrame(raf);loop()});
}
</script>
</body>
</html>
